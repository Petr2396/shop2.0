{% extends "base.html" %}
{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-title">Пароль успешно изменён</h1>

    <div class="auth-success">
      Теперь вы можете войти в аккаунт с новым паролем.
    </div>

    <div class="auth-actions">
      <a class="auth-btn d-flex align-items-center justify-content-center text-decoration-none"
         href="{% url 'accounts:login' %}">
        Перейти ко входу
      </a>
    </div>
  </div>
</div>
{% endblock %}
